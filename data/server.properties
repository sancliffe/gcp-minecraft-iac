# Bedrock Dedicated Server settings, in the server's own key=value format.
# The itzg image also sets many of these from the environment variables in
# docker-compose.yml (SERVER_NAME -> server-name, and so on).

# Server Identity & Networking
server-name=Steanlabs Minecraft
server-port=19132
server-portv6=19133

# Gameplay & World Settings
gamemode=survival
difficulty=normal
level-name=Bedrock level
level-seed=
allow-cheats=false
online-mode=true
allow-list=true
default-player-permission-level=member
texturepack-required=false
max-players=10
player-idle-timeout=30

# Performance & Resource Optimization (Tuned for e2-micro)
view-distance=10
tick-distance=4
max-threads=2

# Movement & Physics Authoritative Settings
server-authoritative-movement=server-auth
player-movement-score-threshold=20
player-movement-distance-threshold=0.3
player-movement-duration-threshold-in-ms=500
correct-player-movement=false
