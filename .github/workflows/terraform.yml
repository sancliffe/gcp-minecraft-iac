name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-validate:
    name: "Terraform Validate & Security Scan"
    runs-on: ubuntu-latest
    # The Terraform configuration lives in terraform/, not the repo root.
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Run TFLint
        run: tflint --init && tflint -f compact

      - name: Run TFSec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          github_token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  # The secrets context can't be used in a job-level "if", so this job reports
  # whether deploy credentials exist. Without GCP_SA_KEY the deploy job is
  # skipped instead of failing at the authentication step.
  check-deploy-config:
    name: "Check deploy credentials"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Check for GCP_SA_KEY
        id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_SA_KEY is not set, so the Terraform deploy job is skipped."
          fi

  terraform-apply:
    name: "Terraform Apply (Production)"
    needs: [terraform-validate, shellcheck, check-deploy-config]
    if: needs.check-deploy-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # Never run two applies against the same state at once.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      # The GCP project defaults to the one the service account key belongs to.
      # Set the repository variables GCP_PROJECT_ID and/or BACKUP_BUCKET_NAME
      # to override. The bucket holds both the Terraform state and the backups.
      - name: Resolve project and state bucket
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || steps.auth.outputs.project_id }}
          BUCKET_OVERRIDE: ${{ vars.BACKUP_BUCKET_NAME }}
        run: |
          BUCKET="${BUCKET_OVERRIDE:-${PROJECT_ID}-minecraft-backups}"
          {
            echo "TF_VAR_project_id=${PROJECT_ID}"
            echo "TF_VAR_backup_bucket_name=${BUCKET}"
            echo "STATE_BUCKET=${BUCKET}"
          } >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config=backend.hcl

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
