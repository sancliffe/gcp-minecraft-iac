name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-validate:
    name: "Terraform Validate & Security Scan"
    runs-on: ubuntu-latest
    # The Terraform configuration lives in terraform/, not the repo root.
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      # Once terraform/.terraform.lock.hcl is committed (see lock.yml), CI must use
      # exactly the locked providers and fails if they would change.
      - name: Terraform Init
        id: init
        run: |
          if [ -f .terraform.lock.hcl ]; then
            terraform init -backend=false -lockfile=readonly
          else
            echo "::notice::No terraform/.terraform.lock.hcl yet. Run the 'Update provider lock file' workflow (or 'make lock') and commit the result."
            terraform init -backend=false
          fi

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Run TFLint
        run: tflint --init && tflint -f compact

      - name: Run TFSec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          github_token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: "ShellCheck & script tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Run script tests
        run: |
          ./tests/test-startup.sh
          ./tests/test-deploy.sh

  # Pull request dry run. The plan job needs its own READ-ONLY credentials, set up
  # as described in the README ("Plan on pull requests"). It never falls back to
  # the deploy key GCP_SA_KEY, because pull request code runs with these
  # credentials. Fork pull requests get no secrets, so they are skipped.
  #
  # Two ways to authenticate, checked in this order:
  #   1. Workload identity federation: repository variables
  #      GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT (no stored key)
  #   2. A service account key: repository secret GCP_PLAN_SA_KEY
  check-plan-config:
    name: "Check plan credentials"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      method: ${{ steps.check.outputs.method }}
    steps:
      - name: Pick the authentication method
        id: check
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          PLAN_SA_KEY: ${{ secrets.GCP_PLAN_SA_KEY }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "method=wif" >> "$GITHUB_OUTPUT"
          elif [ -n "$PLAN_SA_KEY" ]; then
            echo "method=key" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No plan credentials configured (GCP_PLAN_SA_KEY, or GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT), so the terraform plan job is skipped."
          fi

  terraform-plan:
    name: "Terraform Plan (dry run)"
    needs: [terraform-validate, check-plan-config]
    if: needs.check-plan-config.outputs.method != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # only used by workload identity federation
    # A newer push to the same pull request replaces the running plan.
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (workload identity federation)
        id: auth_wif
        if: needs.check-plan-config.outputs.method == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (service account key)
        id: auth_key
        if: needs.check-plan-config.outputs.method == 'key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PLAN_SA_KEY }}

      # The wrapper script would add its own output to plan.txt.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      # The project comes from GCP_PROJECT_ID, or from the key's own project.
      # Workload identity federation can't infer it, so it must be set there.
      - name: Resolve project and state bucket
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || steps.auth_key.outputs.project_id }}
          BUCKET_OVERRIDE: ${{ vars.BACKUP_BUCKET_NAME }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Set the repository variable GCP_PROJECT_ID (required with workload identity federation)."
            exit 1
          fi
          BUCKET="${BUCKET_OVERRIDE:-${PROJECT_ID}-minecraft-backups}"
          {
            echo "TF_VAR_project_id=${PROJECT_ID}"
            echo "TF_VAR_backup_bucket_name=${BUCKET}"
            echo "STATE_BUCKET=${BUCKET}"
          } >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config=backend.hcl

      # -lock=false: a dry run must neither write state nor block a real apply.
      # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error. The exit code
      # is recorded and the step passes, so the comment is posted even when the
      # plan fails; the last step then fails the job on an error.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan"
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the plan on the pull request
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@v7
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const max = 60000;
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > max) {
              plan = plan.slice(0, max) + '\n... truncated, see the job log for the full plan ...';
            }
            const status = { '0': 'no changes', '2': 'changes', '1': 'error' }[process.env.PLAN_EXIT_CODE] || 'unknown';
            const body = [
              marker,
              `### Terraform plan: ${status}`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              `Dry run only, nothing was applied. Commit ${process.env.HEAD_SHA.slice(0, 7)}.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if the plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "::error::terraform plan failed. See the plan output above."
          exit 1

  # The secrets context can't be used in a job-level "if", so this job reports
  # whether deploy credentials exist. Without GCP_SA_KEY the deploy job is
  # skipped instead of failing at the authentication step.
  check-deploy-config:
    name: "Check deploy credentials"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Check for GCP_SA_KEY
        id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_SA_KEY is not set, so the Terraform deploy job is skipped."
          fi

  terraform-apply:
    name: "Terraform Apply (Production)"
    needs: [terraform-validate, shellcheck, check-deploy-config]
    if: needs.check-deploy-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # Never run two applies against the same state at once.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      # The GCP project defaults to the one the service account key belongs to.
      # Set the repository variables GCP_PROJECT_ID and/or BACKUP_BUCKET_NAME
      # to override. The bucket holds both the Terraform state and the backups.
      - name: Resolve project and state bucket
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || steps.auth.outputs.project_id }}
          BUCKET_OVERRIDE: ${{ vars.BACKUP_BUCKET_NAME }}
        run: |
          BUCKET="${BUCKET_OVERRIDE:-${PROJECT_ID}-minecraft-backups}"
          {
            echo "TF_VAR_project_id=${PROJECT_ID}"
            echo "TF_VAR_backup_bucket_name=${BUCKET}"
            echo "STATE_BUCKET=${BUCKET}"
          } >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config=backend.hcl

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
