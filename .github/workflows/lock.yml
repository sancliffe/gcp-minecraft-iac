name: "Update provider lock file"

# Run this from the Actions tab ("Run workflow") to create or refresh
# terraform/.terraform.lock.hcl, which pins the exact Google provider version and
# its checksums for Linux, macOS and Windows. It needs no GCP credentials. If the
# file changes, the workflow pushes branch chore/update-lock-file and opens a
# pull request. The same thing locally: `make lock`.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-lock-file
  cancel-in-progress: false

jobs:
  lock:
    name: "Generate lock file"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false -input=false

      # Same platforms as `make lock`.
      - name: Record provider checksums for all platforms
        working-directory: terraform
        run: >
          terraform providers lock
          -platform=linux_amd64
          -platform=darwin_arm64
          -platform=darwin_amd64
          -platform=windows_amd64

      - name: Open a pull request if the lock file changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/update-lock-file
        run: |
          if [ -z "$(git status --porcelain -- terraform/.terraform.lock.hcl)" ]; then
            echo "The lock file is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add terraform/.terraform.lock.hcl
          git commit -m "build: update Terraform provider lock file"
          git push --force origin "$BRANCH"

          # Needs Settings > Actions > General > "Allow GitHub Actions to create
          # and approve pull requests". Without it the branch is still pushed.
          if ! gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
            --title "build: update Terraform provider lock file" \
            --body "Generated by the Update provider lock file workflow. Pins the exact Google provider version and checksums (linux_amd64, darwin_arm64, darwin_amd64, windows_amd64). CI then fails if the providers would change.

          Checks do not start automatically on a pull request opened by a workflow. Close and reopen it, or push an empty commit, to run them."; then
            echo "::warning::Could not open a pull request (one may already exist, or the repository setting above is off). The branch $BRANCH was pushed: open a pull request from it."
          fi
