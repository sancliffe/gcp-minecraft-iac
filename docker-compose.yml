services:
  minecraft-bedrock:
    # ${MC_IMAGE} comes from the .env file next to this one. On the VM, the startup
    # script writes it from the server_image Terraform variable. Without a .env
    # (running compose by hand) the default below follows the newest published
    # build of github.com/sancliffe/gcp-custom-bedrock-server. The VM runs
    # `docker compose pull` on every boot, so ":latest" really does track new builds.
    image: ${MC_IMAGE:-superflea2828/gcp-custom-bedrock-server:latest}
    container_name: bedrock-server
    restart: unless-stopped
    network_mode: host
    # Give the server time to save the world when the container stops (the
    # default is 10 seconds).
    stop_grace_period: 30s
    # Keep the server console attached so `docker attach bedrock-server` can run
    # commands such as `op <name>` (detach with Ctrl-p Ctrl-q).
    stdin_open: true
    tty: true
    # Cap container logs so they can't fill the 30 GB boot disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No `environment:` block: the custom image does not read environment
    # variables. All server settings live in data/server.properties, which the VM
    # receives from this repo and the image uses as /data/server.properties.
    volumes:
      - ./data:/data
