services:
  minecraft-bedrock:
    image: superflea2828/gcp-custom-bedrock-server:latest
    container_name: bedrock-server
    restart: unless-stopped
    network_mode: host
    # Cap container logs so they can't fill the 30 GB boot disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      EULA: "TRUE"
      SERVER_NAME: "Steanlabs Minecraft"
      DIFFICULTY: "normal"
      GAMEMODE: "survival"
      TRANSPORT: "nethernet"
      SERVER_PORT: "19132"
      SERVER_PORT_V6: "19133"
      SERVER_UDP_PORTS: "19140-19150"
      ALLOW_LIST: "true"
      OPS: "superflea2828"
      VIEW_DISTANCE: "6"
      TICK_DISTANCE: "4"
      MAX_THREADS: "2"
    volumes:
      - ./data:/data