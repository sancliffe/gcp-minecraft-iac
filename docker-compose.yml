services:
  minecraft-bedrock:
    image: minecraft-bedrock:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bedrock-server
    restart: unless-stopped
    network_mode: host
    stdin_open: true
    tty: true
    # Cap container logs so they can't fill the 30 GB boot disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      EULA: "TRUE"
    volumes:
      - ./data:/data
